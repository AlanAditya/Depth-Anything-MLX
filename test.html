<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Blue Sports Car - External Scan</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #020205; }
        canvas { display: block; }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .hud-text {
            color: #00ffff;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px #00ffff;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .title { font-size: 20px; font-weight: bold; border-bottom: 1px solid #00ffff; display: inline-block; padding-bottom: 5px; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        
        #loading-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffff;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            pointer-events: none;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border: 1px solid #00ffff;
        }
        #progress-bar {
            width: 200px;
            height: 2px;
            background: #003344;
            margin-top: 10px;
            position: relative;
        }
        #progress-fill {
            width: 0%;
            height: 100%;
            background: #00ffff;
            transition: width 0.2s;
        }
    </style>
</head>
<body>

<div id="ui-layer">
    <div class="hud-text">
        <div class="title">TARGET: F458_ITALIA_SCANNED</div>
        <div>SOURCE: <span class="blink">EXTERNAL_DB_LINK</span></div>
        <div id="status-log" style="margin-top: 10px; font-size: 10px; opacity: 0.7;">
            > CONNECTING TO CDN...<br>
            > DECOMPRESSING DRACO MESH...<br>
            > GENERATING POINT CLOUD...
        </div>
    </div>
    <div class="hud-text" style="text-align: right;">
        VERTICES: <span id="vertex-count">0</span><br>
        FPS: <span id="fps">--</span>
    </div>
</div>

<div id="loading-overlay">
    <div>ESTABLISHING LINK...</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
</div>

<!-- Import Map to resolve 'three' dependency inside loaders -->
<script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js"
        }
    }
</script>

<!-- Use Module type to import standard Three.js loaders cleanly -->
<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/loaders/DRACOLoader.js';

    // --- Configuration ---
    const PRIMARY_COLOR = 0x00ffff;
    const SECONDARY_COLOR = 0xff0055; // For specialized parts like calipers/engine
    const GLASS_COLOR = 0x0055ff;
    
    // --- Scene Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020205);
    scene.fog = new THREE.FogExp2(0x020205, 0.05);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(4.0, 1.5, 4.0);
    camera.lookAt(0, 0.5, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const carGroup = new THREE.Group();
    scene.add(carGroup);
    
    // Grid
    const gridHelper = new THREE.GridHelper(20, 40, 0x112233, 0x051020);
    scene.add(gridHelper);

    // --- Interaction Variables ---
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    
    // --- Fallback Generator (Procedural) ---
    function createProceduralCar() {
        // Updates UI to reflect fallback
        const log = document.getElementById('status-log');
        if(log) log.innerHTML += "<br>> EXTERNAL LOAD FAILED.<br>> INITIATING PROCEDURAL GENERATION...";

        const geometry = new THREE.BufferGeometry();
        const vertices = [];
        const colors = [];
        const numPoints = 80000;
        const colorMain = new THREE.Color(PRIMARY_COLOR);
        
        for (let i = 0; i < numPoints; i++) {
            // Random point in box
            const x = (Math.random() - 0.5) * 4.6;
            const y = Math.random() * 1.3;
            const z = (Math.random() - 0.5) * 2.1;
            const absZ = Math.abs(z);

            // SDF Logic for Car Shape (Wedge + Cabin)
            let isInside = false;
            let wedgeHeight = (x > 0) ? 0.65 - x * 0.22 : 0.65 + x * 0.02;
            let cabinHeight = 0;
            
            // Cabin Bubble
            if (x > -1.2 && x < 0.6 && absZ < 0.65) {
                cabinHeight = 1.15;
                if (x > -0.2) cabinHeight -= (x + 0.2) * 0.9; // Windshield
                if (x < -0.6) cabinHeight -= (-0.6 - x) * 0.5; // Rear window
                cabinHeight -= (absZ * absZ) * 0.3; // Roof curve
            }

            const maxY = Math.max(wedgeHeight, cabinHeight);
            
            // Wheel wells
            const distFront = Math.sqrt(Math.pow(x - 1.35, 2) + Math.pow(y, 2));
            const distRear = Math.sqrt(Math.pow(x + 1.35, 2) + Math.pow(y, 2));
            
            // Check bounds
            if (y < maxY && y > 0.15 && absZ < 0.95) {
                // Cut out wheels
                if (!((distFront < 0.34 || distRear < 0.34) && absZ > 0.5)) {
                    // Taper front nose
                     if (!(x > 0.5 && absZ > 0.95 - (x-0.5)*0.15)) {
                        isInside = true;
                    }
                }
            }
            
            // Add point if inside hull
            if (isInside) {
                vertices.push(x, y, z);
                
                // Color logic
                let c = colorMain.clone();
                // Darker bottom
                if (y < 0.3) c.multiplyScalar(0.5);
                // Highlight cabin
                if (y > 0.7) c.offsetHSL(0, 0, 0.2);
                
                colors.push(c.r, c.g, c.b);
            }
        }
        
        // Add wheels explicitly
        const wheelPoints = 5000;
        const wheelColor = new THREE.Color(SECONDARY_COLOR);
        for(let i=0; i<wheelPoints; i++) {
             const isFront = Math.random() > 0.5;
             const cx = isFront ? 1.35 : -1.35;
             const isLeft = Math.random() > 0.5;
             const cz = isLeft ? 0.85 : -0.85;
             
             const r = 0.15 + Math.random() * 0.17;
             const angle = Math.random() * Math.PI * 2;
             const w = (Math.random() - 0.5) * 0.25;
             
             vertices.push(cx + Math.cos(angle)*r, 0.34 + Math.sin(angle)*r, cz + w);
             colors.push(wheelColor.r, wheelColor.g, wheelColor.b);
        }

        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        
        const material = new THREE.PointsMaterial({
            size: 0.015,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });
        
        const mesh = new THREE.Points(geometry, material);
        carGroup.add(mesh);
        
        // Update UI
        document.getElementById('vertex-count').innerText = "GENERATED";
        const overlay = document.getElementById('loading-overlay');
        if(overlay) overlay.remove();
    }


    // --- Load External Model ---
    const manager = new THREE.LoadingManager();
    
    manager.onProgress = function ( item, loaded, total ) {
        const percent = (loaded / total) * 100;
        const fill = document.getElementById('progress-fill');
        if (fill) fill.style.width = percent + '%';
    };

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
    dracoLoader.setDecoderConfig({ type: 'js' });

    const loader = new GLTFLoader(manager);
    loader.setDRACOLoader(dracoLoader);

    const MODEL_URL = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/models/gltf/ferrari.glb';
    
    let totalPoints = 0;

    loader.load( MODEL_URL, function ( gltf ) {

        const model = gltf.scene;
        // Process every mesh in the loaded model
        model.traverse( function ( child ) {
            if ( child.isMesh ) {
                const name = child.name.toLowerCase();
                let pColor = PRIMARY_COLOR;
                let pSize = 0.015;
                let pOpacity = 0.8;

                if (name.includes('glass') || name.includes('window')) {
                    pColor = GLASS_COLOR;
                    pOpacity = 0.3; 
                } else if (name.includes('caliper') || name.includes('light') || name.includes('brake')) {
                    pColor = SECONDARY_COLOR;
                    pSize = 0.02; 
                } else if (name.includes('rim') || name.includes('wheel')) {
                    pColor = 0xffffff;
                }

                const geometry = child.geometry;
                const material = new THREE.PointsMaterial({
                    color: pColor,
                    size: pSize,
                    transparent: true,
                    opacity: pOpacity,
                    blending: THREE.AdditiveBlending,
                    sizeAttenuation: true
                });

                const points = new THREE.Points(geometry, material);
                
                points.position.copy(child.position);
                points.rotation.copy(child.rotation);
                points.scale.copy(child.scale);
                points.quaternion.copy(child.quaternion);
                
                carGroup.add(points);
                totalPoints += geometry.attributes.position.count;
            }
        } );

        // Center the car
        const box = new THREE.Box3().setFromObject(carGroup);
        const center = box.getCenter(new THREE.Vector3());
        carGroup.position.sub(center); 
        carGroup.position.y += 0.5;

        // Update UI
        const overlay = document.getElementById('loading-overlay');
        if (overlay) {
            overlay.style.opacity = 0;
            setTimeout(() => {
                const el = document.getElementById('loading-overlay');
                if (el) el.remove();
            }, 500);
        }
        document.getElementById('vertex-count').innerText = totalPoints.toLocaleString();

    }, undefined, function ( error ) {
        // ERROR HANDLER: Trigger Fallback
        console.warn( "External model failed. Switching to fallback.", error );
        const overlay = document.getElementById('loading-overlay');
        if(overlay) {
            overlay.innerHTML = "<div style='color:#ff0055'>CONNECTION FAILED<br>SWITCHING TO PROCEDURAL BACKUP...</div>";
        }
        setTimeout(() => {
            // Remove any partial load
            while(carGroup.children.length > 0){ 
                carGroup.remove(carGroup.children[0]); 
            }
            createProceduralCar();
        }, 1500);
    } );


    // --- Interaction Logic ---
    const wrapper = document.body; 

    wrapper.addEventListener('mousedown', (e) => {
        isDragging = true;
        previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    wrapper.addEventListener('mouseup', () => { isDragging = false; });
    wrapper.addEventListener('mouseleave', () => { isDragging = false; });
    
    wrapper.addEventListener('touchstart', (e) => {
        isDragging = true;
        previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    });
    wrapper.addEventListener('touchend', () => { isDragging = false; });

    wrapper.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const deltaMove = { x: e.clientX - previousMousePosition.x, y: e.clientY - previousMousePosition.y };
        rotateCar(deltaMove);
        previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    wrapper.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const deltaMove = { x: e.touches[0].clientX - previousMousePosition.x, y: e.touches[0].clientY - previousMousePosition.y };
        rotateCar(deltaMove);
        previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    });

    function rotateCar(delta) {
        carGroup.rotation.y += delta.x * 0.005;
        carGroup.rotation.x += delta.y * 0.005;
    }

    // Handle Window Resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Animation Loop ---
    let time = 0;
    const fpsElem = document.getElementById('fps');
    let frameCount = 0;
    let lastTime = performance.now();

    function animate() {
        requestAnimationFrame(animate);
        time += 0.01;
        frameCount++;

        if (performance.now() - lastTime >= 1000) {
            fpsElem.innerText = frameCount;
            frameCount = 0;
            lastTime = performance.now();
        }

        // Idle auto-rotation
        if (!isDragging) {
            carGroup.rotation.y += 0.001;
        }

        carGroup.position.y = 0.5 + Math.sin(time) * 0.01;
        renderer.render(scene, camera);
    }

    animate();

</script>
</body>
</html>
